# Input and output paths
data:
  input_path: "./converted_proofs.jsonl"
  output_dir: "./results"
  proofs_dir: "./proofs"
  traces_dir: "./traces"
  max_samples: null
  input_format: "auto"
  workers: 9

# Local formal prover model served through vLLM / OpenAI-compatible API
formal_llm:
  base_url: "http://127.0.0.1:8010/v1"
  api_key: "empty"
  model: "Goedel-LM/Goedel-Prover-V2-8B"
  temperature: 0.2
  max_tokens: 8192

# Remote informal model served by yunwu.ai in OpenAI-compatible format
informal_llm:
  base_url: "http://yunwu.ai/v1"
  api_key: "replace-me"
  model: "gpt-5.5"
  temperature: 0.3
  max_tokens: 1024

# Lean verifier settings
verifier:
  lean_command: "lake env lean"
  timeout_seconds: 60
  max_retries: 3

# Iteration limits and decomposition strategy
workflow:
  max_formal_attempts: 4
  max_outer_loops: 3
  max_lemma_rounds: 3
  max_lemma_count: 5
  require_formal_validation: true

# Prompt templates
prompts:
  formal_system: "You are a strong Lean prover."
  informal_plan_system: "You are a strong Lean proof planner."
  informal_decision_system: "You are a strong Lean proof selector."
  proof_plan_prefix: "Current proof plan:"
  previous_attempt_prefix: "Previous proof attempt:"
  verifier_error_prefix: "Verifier error:"
  formal_skeleton_instruction: "You are proving the bottom-most theorem in a Lean proof skeleton. The prompt includes the current Lean header, the theorem statement, and possibly earlier lemmas that are already assumed established. Do not re-prove or modify the earlier lemmas. Only fill in the proof for the current bottom-most theorem. Output Lean code only. Do not get stuck in repetitive self-checking loops; if the current direction is not working, make a decisive progress step."

# Runtime logging and trace settings
runtime:
  show_progress: true
  save_event_log: true
  save_lemma_tree: true

# Lemma formalizer: converts natural-language lemma statements into Lean theorem statements
formalizer_llm:
  base_url: "http://127.0.0.1:8011/v1"
  api_key: "empty"
  model: "Goedel-LM/Goedel-Formalizer-V2-8B"
  temperature: 0.9
  max_tokens: 4096

formalizer_prompt:
  system: "You are a strong Lean prover."
  user_template: "Task: generate a Lean theorem statement for the lemma below.\n\nInput:\n- Lean header:\n{header}\n- Current theorem to prove:\n{theorem}\n- Current proof plan:\n{plan}\n- Natural-language description:\n{nl_statement}\n\nRequirements:\n- Output only Lean code.\n- Generate a theorem statement that is compatible with the current Lean context.\n- Preserve the theorem name: {problem_name}.\n- Do not add explanation or commentary."
  code_block_language: "lean4"
